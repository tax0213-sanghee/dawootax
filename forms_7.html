<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세무법인 다우 — 서식 작성</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDEDED;
    --card:#FFFFFF;
    --primary:#4F53D6;
    --primary-dark:#3F43B5;
    --primary-soft:#EEEEFB;
    --text:#1C1C28;
    --muted:#8A8FA3;
    --input-bg:#F2F2F5;
    --border:#E7E7EC;
    --ok:#2E9E62;
    --ok-soft:#E7F6EE;
    --warn-soft:#FFF7E0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Noto Sans KR',sans-serif; font-size:16px; background:var(--bg); color:var(--text); line-height:1.6; }
  /* 임금 - 추가임금 항목 추가(견적서 방식) */
  .add-item-pill{ width:100%; max-width:300px; padding:9px; border:1.5px dashed var(--primary); border-radius:10px; background:none; color:var(--primary); font-weight:700; font-size:13px; cursor:pointer; font-family:inherit; margin-top:12px; }
  .add-item-pill:hover{ background:var(--primary-soft); }
  .subno{ color:var(--primary); font-weight:800; margin-right:3px; }
  .pay-line{ margin-bottom:7px; }
  .pay-item-row{ display:flex; align-items:center; gap:8px; margin-top:7px; }
  .pay-item-row .blank.name{ min-width:150px; width:180px; }
  .pay-item-del{ color:var(--muted); cursor:pointer; font-weight:700; padding:2px 8px; display:none; }
  .pay-item-row.has-content .pay-item-del{ display:inline; }
  .pay-item-del:hover{ color:#E0483D; }
  .amt-wrap{ white-space:nowrap; }
  .blank:disabled{ background:var(--input-bg); color:var(--muted); cursor:not-allowed; }
  .brk-note{ outline:none; border-radius:4px; padding:1px 4px; }
  .brk-note:focus{ background:var(--primary-soft); }
  .doc-line.row-inline > .brk-line{ display:block !important; margin-top:3px; color:var(--muted); }
  /* 제목(번호) 아래 문구는 숫자 라인 뒤로 들여쓰기 */
  .doc-line:not(.row-inline) > .clause-body,
  .doc-line:not(.row-inline) > div:not(.doc-sub),
  .doc-line .brk-line{ padding-left:1.3em; }
  .monthly-box{ background:var(--input-bg); border-radius:6px; padding:3px 10px; color:var(--primary); font-weight:800; }
  .pay-sep{ color:var(--muted); margin:0 3px; }
  .pay-mode{ font-size:12.5px; padding:2px 6px; margin-left:2px; }
  .net-est{ display:block; background:var(--input-bg); border-radius:8px; padding:7px 12px; margin:6px 0 0 18px; font-size:13px; color:var(--muted); }
  .net-est b{ color:var(--text); }
  .pay-box{ margin-top:8px; margin-left:18px; border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:var(--card); }
  .pay-box-title{ font-size:12.5px; font-weight:800; color:var(--primary); margin-bottom:8px; display:flex; align-items:center; gap:6px; cursor:pointer; }
  .pay-box-toggle{ margin-left:auto; color:var(--primary); font-weight:700; }
  .pay-box.collapsed .pay-box-body{ display:none; }
  .pay-box.collapsed .pay-box-title{ margin-bottom:0; }
  .pay-grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px 18px; }
  .pay-box-body{ container-type:inline-size; display:flex; flex-direction:column; gap:5px; }
  .pay-flow{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:center; gap:5px 16px; }
  .pay-cell{ display:flex; align-items:center; gap:5px; min-width:0; white-space:nowrap; min-height:28px; }
  .pay-flow .pay-cell{ padding-right:13px; }   /* 추가항목 ✕ 공간과 맞춰 원단위 정렬 */
  .pay-cell .pl{ margin-right:0; flex-shrink:0; }
  .pay-flow .amt-wrap{ display:inline-flex; align-items:center; gap:2px; flex:1 1 auto; min-width:0; }
  .pay-flow .amt-wrap input.amt{ flex:1 1 36px; width:auto !important; min-width:0; }
  .pay-flow .pay-amt{ flex:1 1 auto; text-align:right; min-width:0; }
  /* 사용자 추가 항목: 한 줄에 2개씩 (금액칸 확보 위해 ✕는 절대배치) */
  .custom-list{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-rows:28px; align-items:center; gap:5px 16px; }
  .custom-list .pay-item-row{ position:relative; display:flex; align-items:center; gap:3px; min-width:0; white-space:nowrap; padding-right:13px; }
  .custom-list .pay-item-row .pi-ck{ flex:0 0 auto; margin:0; }
  .custom-list .pay-item-row .name{ flex:1 1 34px; width:auto !important; min-width:0; }
  .custom-list .pi-colon{ flex:0 0 auto; color:var(--muted); }
  .custom-list .pay-item-row .amt-wrap{ display:inline-flex; align-items:center; gap:1px; flex:1 1 58px; min-width:0; }
  .custom-list .pay-item-row .amt-wrap input.amt{ flex:1 1 50px; width:auto !important; min-width:0; text-align:right; }
  .custom-list .pay-item-row .pay-item-del{ display:block; position:absolute; right:-3px; top:50%; transform:translateY(-50%); padding:2px 3px; }
  @container (max-width:519px){ .pay-flow .pay-amt{ font-size:11.5px; } .pay-flow .pl{ font-size:11.5px; } }
  .pay-amt{ font-weight:800; color:var(--text); }
  .np-note{ display:block; margin-top:6px; color:#C0392B; font-size:12.5px; font-weight:600; background:var(--input-bg); border-radius:8px; padding:7px 12px; }
  .np-note:empty{ display:none; }
  .wage-check{ font-size:13px; color:var(--muted); margin-top:6px; margin-left:18px; padding:7px 12px; background:var(--input-bg); border-radius:8px; }
  .wage-check:empty{ display:none; }
  /* 숫자 증감 스텝퍼(박스 안 ▲▼) */
  .stepper{ position:relative; display:inline-block; }
  .stepper > input.step{ padding-left:6px; padding-right:15px; text-align:center; }
  .stepbtns{ position:absolute; right:2px; top:2px; bottom:2px; width:13px; display:flex; flex-direction:column; visibility:hidden; }
  .stepper:hover .stepbtns, .stepper > input.step:focus + .stepbtns{ visibility:visible; }   /* 히든 탭: 마우스오버·포커스 시에만 표시 */
  .stepbtns button{ flex:1; border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:7px; line-height:1; padding:0; display:flex; align-items:center; justify-content:center; font-family:inherit; }
  .stepbtns button:hover, .stepbtns button:active{ color:var(--primary); }

  .backbtn{ background:#fff; border:1px solid var(--border); border-radius:10px; padding:8px 14px;
    font-family:inherit; font-size:13px; font-weight:700; color:var(--text); cursor:pointer; white-space:nowrap; display:none; }
  .backbtn:hover{ border-color:var(--primary); color:var(--primary); }
  body.from-office .backbtn{ display:inline-block; }
  body.from-office .doc-picker{ display:none; }
  body.from-office .nav-links{ display:none; }
  @media(max-width:520px){ .backbtn{ padding:7px 11px; font-size:12.5px; } }
  .stale-warn{ background:#FDEEEC; border:1px solid #F0C4BE; color:#8A3B2E; border-radius:12px;
    padding:12px 15px; font-size:13.5px; line-height:1.6; margin:0 0 14px; }
  .of-box{ background:var(--input-bg); border-radius:12px; padding:14px 16px; }
  .of-r{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:13px; padding:3px 0; }
  .of-r span{ color:var(--muted); }
  .of-r b{ font-weight:700; }
  .of-a{ margin-top:8px; padding-top:8px; border-top:1px solid var(--border); font-size:12.5px; color:var(--muted); line-height:1.5; }
  .clause-body{ white-space:pre-line; }
  .stdrows{ }
  .stdrow{ font-size:14.5px; line-height:2.0; margin:2px 0; }
  .paytbl{ border:1px solid var(--border); border-radius:10px; overflow:hidden; margin:8px 0 10px; }
  .ptr{ display:grid; grid-template-columns:86px minmax(0,1.1fr) minmax(0,1.2fr) minmax(0,1fr);
        gap:8px; align-items:center; padding:7px 12px; border-top:1px solid var(--border); line-height:1.6; margin:0; }
  .ptr.pt3{ grid-template-columns:86px minmax(0,1.2fr) minmax(0,1.2fr); }
  .paytbl > .ptr:first-child{ border-top:0; background:var(--input-bg); font-size:12.5px; font-weight:800; color:var(--muted); }
  .ptr > span{ display:flex; align-items:center; gap:5px; white-space:nowrap; }
  .ptr input{ width:100% !important; min-width:0; }
  @media(max-width:640px){ .ptr{ grid-template-columns:64px minmax(0,1fr); row-gap:4px; }
    .ptr.pt3{ grid-template-columns:64px minmax(0,1fr); } }
  .doc-picker{ display:flex; gap:8px; overflow-x:auto; padding:4px 0 14px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  @media(min-width:900px){ .doc-picker{ flex-wrap:wrap; overflow:visible; } }
  @media(max-width:760px){ .panel-hint{ display:none; } }
  .doc-picker::-webkit-scrollbar{ display:none; }
  .dp{ flex:0 0 auto; background:#fff; border:1px solid var(--border); border-radius:99px; padding:9px 16px;
       font-family:inherit; font-size:13.5px; font-weight:700; color:var(--muted); cursor:pointer; white-space:nowrap; }
  .dp:hover{ border-color:var(--primary); color:var(--primary); }
  .dp.on{ background:var(--primary); border-color:var(--primary); color:#fff; }
  .ck-list{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px 18px; margin-top:6px; }
  .ck-list label{ display:flex; align-items:center; gap:7px; font-size:14px; }
  .ck-list.ck-desc{ grid-template-columns:1fr; gap:9px; }
  .ck-list.ck-desc label{ align-items:flex-start; }
  .ck-list.ck-desc input[type=checkbox]{ margin-top:3px; }
  .apg{ display:grid; grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr); gap:9px 10px;
        align-items:center; margin-top:8px; }
  .apg > label{ font-size:12.5px; font-weight:700; color:var(--muted); white-space:nowrap; }
  .apg > input,.apg > select{ width:100% !important; min-width:0; }
  .apg > .wide2{ grid-column:2 / -1; }
  @media(max-width:700px){ .apg{ grid-template-columns:auto minmax(0,1fr) } .apg > .wide2{ grid-column:2 / -1 } }
  .apof{ display:flex; flex-wrap:wrap; gap:5px 14px; font-size:13px; color:var(--muted);
         background:var(--input-bg); border-radius:10px; padding:9px 13px; margin-top:6px; }
  .apof b{ color:var(--text); }
  .aprow{ margin-bottom:4px !important; border-top:0 !important; padding-top:2px !important; }
  .ck-list .d{ display:block; font-size:12.5px; color:var(--muted); font-weight:400; margin-top:1px; }
  @media(min-width:820px){ .ck-list.ck-desc{ grid-template-columns:1fr 1fr; gap:9px 22px; } }
  .ck-list input[type=checkbox]{ width:16px; height:16px; accent-color:var(--primary); flex:none; }
  @media(max-width:700px){ .ck-list{ grid-template-columns:1fr; } }
  .wk-hd,.wk-row{ display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 24px;
      gap:6px; align-items:center; }
  .wk-hd{ font-size:11.5px; font-weight:800; color:var(--muted); margin:8px 0 4px; }
  .wk-row{ margin-bottom:5px; }
  .wk-row input{ width:100% !important; min-width:0; }
  .wk-del{ color:var(--muted); cursor:pointer; font-weight:700; text-align:center; }
  .wk-del:hover{ color:#E0483D; }
  @media(max-width:620px){
    .wk-hd{ display:none; }
    .wk-row{ grid-template-columns:1fr 1fr 22px; gap:5px; margin-bottom:10px;
      padding-bottom:10px; border-bottom:1px dashed var(--border); }
    .wk-row input:nth-child(1){ grid-column:1; }
    .wk-row input:nth-child(2){ grid-column:2; }
    .wk-row input:nth-child(3){ grid-column:1; }
    .wk-row input:nth-child(4){ grid-column:2; }
    .wk-del{ grid-column:3; grid-row:1; }
  }
  nav{
    position:sticky; top:0; z-index:50;
    background:#fff; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; padding:16px 40px;
  }
  .brand{ display:flex; align-items:center; gap:6px; font-weight:800; font-size:19px; color:var(--text); }
  .brand .dot{ width:8px; height:8px; background:var(--primary); border-radius:3px; }
  .tabs{ display:flex; gap:32px; }
  .tab-btn{ background:none; border:none; color:var(--muted); font-family:inherit; padding:8px 2px; font-size:14.5px; font-weight:600; cursor:pointer; position:relative; }
  .tab-btn.active{ color:var(--text); }
  .tab-btn.active::after{ content:''; position:absolute; left:0; right:0; bottom:-17px; height:2px; background:var(--primary); }
  .credit-badge{ background:var(--primary-soft); color:var(--primary); font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:20px; }
  .nav-right{ display:flex; align-items:center; gap:22px; }
  .nav-links{ display:flex; align-items:center; gap:18px; }
  .nav-links a{ color:var(--text); font-size:13px; font-weight:500; text-decoration:none; cursor:pointer; }
  .nav-links a:hover{ color:var(--primary); }
  .nav-links a.mypage{ font-weight:700; }

  .page{ display:none; max-width:1180px; margin:0 auto; padding:40px 32px 100px; }
  .page.active{ display:block; }
  .grid2{ display:grid; grid-template-columns:2fr 1fr; gap:20px; align-items:start; }
  .right-col-sticky{ position:sticky; top:80px; align-self:start; }

  .tool-head{ margin-bottom:22px; }
  .tool-head h2{ font-size:24px; font-weight:800; }
  .tool-head p{ color:var(--muted); font-size:14px; margin-top:6px; }

  .panel{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px; box-shadow:0 1px 2px rgba(20,20,40,.03); margin-bottom:16px; }
  .panel-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .panel-head h3{ font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .panel-head h3 .dot{ width:6px; height:6px; background:var(--primary); border-radius:2px; }
  .panel-hint{ font-size:11.5px; color:var(--muted); }

  .subhead{ font-size:12px; font-weight:800; color:var(--primary); letter-spacing:.3px; margin:6px 0 10px; }
  .subhead:first-child{ margin-top:0; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .field{ margin-bottom:12px; }
  .field.full{ grid-column:1 / -1; }
  .field label{ display:block; font-size:12.5px; color:var(--muted); font-weight:600; margin-bottom:5px; }
  .field input[type=text], .field input[type=date], .field input[type=number], .field input[type=email], .field select{
    width:100%; padding:10px 13px; border:1px solid transparent; border-radius:10px; font-size:14px;
    font-family:inherit; background:var(--input-bg); color:var(--text);
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--primary); background:#fff; }

  /* 유형 선택 탭 */
  .type-tabs{ display:grid; grid-template-columns:1fr 1fr 1fr; margin-bottom:14px; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:#fff; }
  .type-tab{ background:#fff; border:none; border-top:3px solid transparent; padding:14px 8px; cursor:pointer; font-size:13.5px; color:var(--text); font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .type-tab + .type-tab{ border-left:1px solid var(--border); }
  .type-tab .ico{ font-size:20px; }
  .type-tab b{ font-weight:800; font-size:14px; }
  .type-tab small{ color:var(--muted); font-size:11px; font-weight:600; }
  .type-tab.active{ border-top-color:var(--primary); background:var(--primary-soft); }
  .type-tab.active b, .type-tab.active small{ color:var(--primary); }

  .doc-toolbar{ display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .seg{ display:flex; background:var(--input-bg); border-radius:10px; padding:3px; }
  .seg button{ padding:9px 16px; border:none; background:none; font-size:13px; font-weight:600; cursor:pointer; color:var(--muted); border-radius:8px; font-family:inherit; }
  .seg button.on{ background:#fff; color:var(--primary); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .seg-label{ font-size:12px; color:var(--muted); font-weight:600; }

  /* 계약서 미리보기 */
  .doc-preview{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:26px 28px; font-size:14.5px; line-height:1.65; position:relative; box-shadow:0 1px 2px rgba(20,20,40,.03); }
  .doc-preview h4{ text-align:center; font-size:19px; font-weight:800; margin-bottom:6px; }
  .doc-preview h4.title-box{ display:table; border:1.5px solid var(--text); border-radius:8px; padding:7px 20px; margin:0 auto 10px; }
  .title-box .tb-name{ display:inline; font-size:18px; font-weight:800; }
  .title-box .tb-term{ display:inline; font-size:13px; font-weight:600; color:var(--muted); margin-left:6px; }
  .doc-intro{ font-size:14px; color:var(--muted); text-align:left; margin-top:20px; margin-bottom:22px; }
  .stamped{ position:absolute; top:20px; right:24px; display:inline-flex; align-items:center; gap:6px; background:var(--ok-soft); color:var(--ok); font-size:12px; font-weight:700; padding:7px 14px; border-radius:20px; opacity:0; transition:opacity .3s; }
  .stamped::before{ content:'✓'; font-weight:900; }
  .stamped.show{ opacity:1; }

  .doc-line{ margin-bottom:11px; border-top:1px solid var(--border); padding-top:11px; }
  .doc-preview > .doc-line:first-of-type{ border-top:none; padding-top:0; }
  .no-screen{ display:none; }   /* 화면에서만 숨김(인쇄는 별도 영역에서 생성) */
  .pay-extras .inline-check{ margin-right:2px; }
  .doc-line .ln{ font-size:15px; color:var(--primary); font-weight:800; display:inline-block; margin-bottom:6px; }
  /* 제목과 답변을 한 줄에 */
  .doc-line.row-inline > .ln{ display:inline; margin-bottom:0; margin-right:8px; }
  .doc-line.row-inline > div:not(.doc-sub){ display:inline; }
  .mbr{ display:none; }   /* 모바일 줄바꿈용(데스크톱 숨김) */
  /* 일반 폰: 제목 다음 줄로 내려 줄바뀜 방지 */
  @media (max-width:600px){
    .mbr{ display:block; }
    .doc-preview .doc-line.row-inline > .ln{ display:block; margin-right:0; margin-bottom:3px; }
    .doc-preview .doc-line.row-inline > div:not(.doc-sub){ display:block; }
    /* 기본임금 세부내역: 폰에서는 한 줄에 하나씩 */
    .pay-flow{ grid-template-columns:1fr; }
    .custom-list{ grid-template-columns:1fr; grid-auto-rows:auto; }
    /* 상여금·기타급여 입력칸: 줄 꽉차게, 길면 아래로 */
    input.blank.xwide{ width:100%; min-width:0; box-sizing:border-box; }
    /* 사회보험: 국민연금+건강보험 / 고용보험+산재보험 각각 한 줄 */
    .ins-cells{ display:grid !important; grid-template-columns:1fr 1fr; gap:4px 8px; }
    .ins-cells .inline-check{ margin-left:0 !important; margin-right:0; }
    .ins-cells .np-note{ grid-column:1 / -1; }
  }
  .clause-wrap{ position:relative; }
  .doc-line .reset-link{ position:absolute; top:5px; right:7px; font-size:16px; line-height:1; color:var(--muted); cursor:pointer; font-weight:700; z-index:1; }
  .doc-line .reset-link:hover{ color:var(--primary); }
  .doc-line .del-line{ float:right; font-size:15px; line-height:1; color:var(--muted); cursor:pointer; font-weight:700; margin-left:8px; padding:0 4px; }
  .doc-line .del-line:hover{ color:#E0483D; }
  /* 사용자 추가 항목(항목 추가) */
  [data-ph]:empty:before{ content:attr(data-ph); color:#b8b8c0; font-weight:400; }
  .custom-clause .ln-num{ color:var(--primary); font-weight:800; }
  .custom-clause .ln-label{ color:var(--primary); font-weight:800; outline:none; border-bottom:1px dashed var(--border); min-width:64px; padding:0 2px; cursor:text; }
  .custom-clause .clause-body{ outline:none; cursor:text; border-radius:6px; }
  .custom-clause .ln-label:hover{ background:#eeeffb; border-bottom-color:var(--primary); }
  .custom-clause .clause-body:hover{ background:#f4f4fb; }
  .custom-clause .ln-label:focus, .custom-clause .clause-body:focus{ background:#eeeffb; }

<script>
/* ============================================================
   세무사스토어 · 고용계약서 모듈
   설계 개요
   - S: 모든 입력값의 단일 소스(state). [data-k]로 양방향 바인딩.
   - 유형(standard/daily/freelance) 선택 → renderContract()가 S 기준으로 조항을 세팅.
   - 조항 문구(.clause-body)는 CLAUSE_DEFAULTS에 기본값 보관 → 개별 수정/리셋 가능.
   - 출력/카톡/이메일: 계약서를 텍스트로 직렬화하여 인쇄·PDF·메일 본문 생성.
   ============================================================ */

const S = {};                 // 공통 상태 (data-k → 값)
let curType = 'standard';     // 현재 유형
let curSub  = '이상';          // 표준: 주15시간 이상/미만
let credit  = 3;

/* ---------- 유틸 ---------- */
const won = n => (n||0).toLocaleString('ko-KR') + '원';
const numVal = s => +(String(s==null?'':s).replace(/[^\d]/g,'')) || 0;   // 콤마 등 제거 후 숫자
function formatAmtEl(el){
  const d = el.value.replace(/[^\d]/g,'');
  el.value = d ? Number(d).toLocaleString('ko-KR') : '';
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2600);
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-'); if(!d) return iso;
  return `${y}년 ${m}월 ${d}일`;
}

/* ---------- 상태 바인딩(양방향) ---------- */
function formatDateEl(el){
  const d = el.value.replace(/[^\d]/g,'').slice(0,8);
  let out = d.slice(0,4);
  if(d.length > 4) out += '-' + d.slice(4,6);
  if(d.length > 6) out += '-' + d.slice(6,8);
  el.value = out;
}
function formatPhoneEl(el){
  const d = el.value.replace(/[^\d]/g,'').slice(0,11);
  let out;
  if(d.startsWith('02')){          // 서울 지역번호
    if(d.length < 3) out = d;
    else if(d.length < 6) out = d.slice(0,2)+'-'+d.slice(2);
    else if(d.length < 10) out = d.slice(0,2)+'-'+d.slice(2,5)+'-'+d.slice(5);
    else out = d.slice(0,2)+'-'+d.slice(2,6)+'-'+d.slice(6);
  } else {
    if(d.length < 4) out = d;
    else if(d.length < 7) out = d.slice(0,3)+'-'+d.slice(3);
    else if(d.length < 11) out = d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
    else out = d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
  }
  el.value = out;
}
function formatBizNoEl(el){           // 사업자등록번호 000-00-00000
  const d = el.value.replace(/[^\d]/g,'').slice(0,10);
  let out = d.slice(0,3);
  if(d.length > 3) out += '-' + d.slice(3,5);
  if(d.length > 5) out += '-' + d.slice(5);
  el.value = out;
}
document.addEventListener('input', e=>{
  const amtEl = e.target.closest('.amt');
  if(amtEl) formatAmtEl(amtEl);          // 금액칸 천단위 콤마
  const dateEl = e.target.closest('.dateauto');
  if(dateEl) formatDateEl(dateEl);       // 날짜칸 자동 하이픈(YYYY-MM-DD)
  const phoneEl = e.target.closest('.phoneauto');
  if(phoneEl) formatPhoneEl(phoneEl);    // 연락처 자동 하이픈

/* 국민연금: 만 60세 이상은 사업장 가입 의무대상이 아니므로 체크 해제 */
function ageFromBirth(b){
  if(!b) return null;
  const m = String(b).match(/(\d{4})-(\d{1,2})-(\d{1,2})/); if(!m) return null;
  const by=+m[1], bm=+m[2], bd=+m[3];
  if(by<1900) return null;
  const now = new Date();
  let age = now.getFullYear() - by;
  if((now.getMonth()+1) < bm || ((now.getMonth()+1)===bm && now.getDate() < bd)) age--;
  return age;
}
function checkPensionEligibility(){
  const box = document.getElementById('contractDoc'); if(!box) return;
  const cell = box.querySelector('#npCell'); if(!cell) return;
  const np = cell.querySelector('input[type=checkbox]');
  const note = box.querySelector('#npNote');
  const age = ageFromBirth(S.wBirth);
  if(age!=null && age>=60){
    np.checked = false; np.disabled = true;
    if(note) note.textContent = '※ 만 60세 이상 · 국민연금 의무가입 대상 아님';
  } else {
    // 기본 상태 복원(표준 15h 이상 → 체크 고정, 그 외 → 편집 가능)
    if(curType==='standard' && curSub==='이상'){ np.checked = true; np.disabled = true; }
    else { np.disabled = false; }
    if(note) note.textContent = '';
  }
}

const EMP_DEDUCT_RATE = 0.094;   // 4대보험 근로자부담 대략(세후→세전 추정용)
/* 월 총액(세전 기준). 세후 입력이면 4대보험 환산해 세전 추정 */
function monthlyTotalGross(){
  const type = pval('s_payType')||'월급';
  const raw = pnum('s_pay');
  const sever = pval('s_severInc')||'미포함';
  let m = type==='연봉' ? (sever==='포함' ? raw/13 : raw/12) : raw;
  if((pval('s_taxBasis')||'세전')==='세후') m = m/(1-EMP_DEDUCT_RATE);
  return Math.round(m);
}
/* 구성내역 수당 합(모두 총액에 포함) */
function allowanceSums(){
  let incl=0;
  ['s_meal','s_car'].forEach(a=>{ if(pck(a+'Ck')) incl += pnum(a); });
  (S.payItems||[]).forEach(it=>{ if(it.on!==false) incl += numVal(it.amt); });
  return {incl, extra:0};
}
/* 급여 구성: 연봉 월환산·세후 추정·기본급 자동·최저임금 체크 */
function updatePay(){
  const box = document.getElementById('contractDoc'); if(!box) return;
  const type = pval('s_payType')||'월급';
  const isNet = (pval('s_taxBasis')||'세전')==='세후';
  const opt = document.getElementById('s_annualOpt');
  if(opt) opt.style.display = (type==='연봉') ? 'inline' : 'none';
  if(type==='연봉'){
    const raw=pnum('s_pay'); const sever=pval('s_severInc')||'미포함';
    const m = Math.round(sever==='포함'? raw/13 : raw/12);
    const el=document.getElementById('s_monthly'); if(el) el.textContent=won(m);
  }
  const gross = monthlyTotalGross();
  const netEst = document.getElementById('s_netEst');
  if(netEst) netEst.innerHTML = (isNet && gross>0)
    ? ` <span class="net-est">(참고) 세전 약 <b>${won(gross)}</b> · 4대보험 약 9.4% 반영(소득세 미반영)</span>` : '';
  const {incl, extra} = allowanceSums();
  const base = Math.max(0, gross - incl);                 // 총액 − 포함수당
  // 기본급을 소정근로분·주휴수당분으로 분리
  const fvp = k => { const i=pEl(k); if(!i) return 0; return numVal(i.value!=='' ? i.value : i.placeholder); };
  const dailyNet = Math.max(0, (fvp('s_h2')+fvp('s_m2')/60) - (fvp('s_h1')+fvp('s_m1')/60) - (fvp('s_bh2')-fvp('s_bh1')));
  const weekly = dailyNet * fvp('s_days');
  const juhue = weekly>=15 ? Math.min(weekly,40)/40*8 : 0;
  const mWork = weekly*(365/12/7), mJuhue = juhue*(365/12/7);
  let juhuePay = 0, basicPay = base;
  if((mWork+mJuhue) > 0 && base > 0){ const hr = base/(mWork+mJuhue); juhuePay = Math.round(hr*mJuhue); basicPay = base - juhuePay; }
  const baseEl = document.getElementById('s_baseAuto');   if(baseEl) baseEl.textContent = won(basicPay);
  const juhEl  = document.getElementById('s_juhueAmt');   if(juhEl)  juhEl.textContent  = won(juhuePay);
  calcHourly(gross + extra);   // 최저임금은 월 실지급(세전) 기준
}

/* 연도별 최저시급(원) */
const MIN_WAGE = { 2024:9860, 2025:10030, 2026:10320 };
function currentMinWage(){
  let y = 2026; try{ y = new Date().getFullYear(); }catch(e){}
  if(MIN_WAGE[y]) return { year:y, wage:MIN_WAGE[y] };
  const years = Object.keys(MIN_WAGE).map(Number).sort((a,b)=>b-a);
  const latest = years[0];
  return { year:latest, wage:MIN_WAGE[latest] };
}
/* 월급여·소정근로시간·휴게·근무일·주휴를 반영해 시급 환산 후 최저시급과 비교 */
function calcHourly(monthlyGrossPay){
  const el = document.getElementById('s_wageCheck');
  if(!el) return;
  const box = document.getElementById('contractDoc'); if(!box) return;
  // 비어 있는 시간·근무일 칸은 기본값(placeholder)으로 대체해 계산
  const fv = k => { const i = box.querySelector(`[data-k="${k}"]`); if(!i) return 0; return numVal(i.value!=='' ? i.value : i.placeholder); };
  const monthly = (monthlyGrossPay!=null) ? monthlyGrossPay : (monthlyTotalGross() + allowanceSums().extra);
  const gross = (fv('s_h2')+fv('s_m2')/60) - (fv('s_h1')+fv('s_m1')/60);
  const brk = fv('s_bh2') - fv('s_bh1');
  const dailyNet = Math.max(0, gross - brk);
  const weekly = dailyNet * fv('s_days');
  if(monthly <= 0 || weekly <= 0){ el.innerHTML=''; return; }
  const juhue = weekly >= 15 ? Math.min(weekly,40)/40*8 : 0;      // 주휴시간(주15h 이상)
  const monthlyHours = Math.round((weekly + juhue) * (365/12/7)); // 월 유급 소정근로시간(주휴 포함, 표준 209시간)
  if(monthlyHours <= 0){ el.innerHTML=''; return; }
  const hourly = Math.floor(monthly / monthlyHours);             // 내림(최저선 아래는 미달로)
  const mw = currentMinWage();
  const ok = hourly >= mw.wage;
  el.innerHTML = `(참고) 환산 시급 약 <b style="color:var(--text);">${won(hourly)}</b>`
    + ` <span style="color:#9a9aa8;">(월 소정근로 ${Math.round(monthlyHours)}h 기준)</span>`
    + ` · ${mw.year} 최저시급 ${won(mw.wage)} 대비 `
    + `<b style="color:${ok?'var(--ok)':'#E0483D'};">${ok?'충족 (O)':'미달 (X)'}</b>`;
}
function updateWage(pfx){
  const w = numVal(S[pfx+'_wage']);
  let h = numVal(S[pfx+'_hours']);
  if(!h) h = 1;   // 시간·횟수를 비워두면 1로 처리(건별 등) → 금액만 입력해도 계산됨
  const out = document.getElementById(pfx+'_total');
  if(out) out.textContent = won(w*h);
}

/* ---------- 서명란(공통) ---------- */
/* 이름(상호·성명)으로 도장 이미지를 자동 생성
   - 근로자(worker): 이름을 세로로(2~3글자 1열, 그 이상 2열)
   - 사업장(biz): 상호를 원 둘레(상단 호)에, 가운데 '대표이사' */
function makeSeal(text, type){
  text = (text||'').trim(); if(!text) return '';
  const RED='#e11414';
  const chars=[...text];
  if(type==='biz'){
    // 사업장: 이중 원 + 상호 둘레 + 가운데 代表理事
    const size=300, cx=150, cy=150, R=140;
    const c=document.createElement('canvas'); c.width=size; c.height=size;
    const x=c.getContext('2d');
    x.strokeStyle=RED; x.fillStyle=RED; x.textAlign='center'; x.textBaseline='middle';
    x.lineWidth=10; x.beginPath(); x.arc(cx,cy,R,0,Math.PI*2); x.stroke();
    const innerR=Math.round(R*0.56);
    x.lineWidth=6; x.beginPath(); x.arc(cx,cy,innerR,0,Math.PI*2); x.stroke();
    const ringMid=(R+innerR)/2;
    const band=R-innerR;                                 // 링 두께
    x.beginPath(); x.arc(cx, cy-ringMid, band*0.16, 0, Math.PI*2); x.fill();   // 상단 점(사이 구분)
    const n=chars.length;
    const gap=Math.max(0.34, 3.6/(n+4));                 // 상단 점 자리(작게 → 상호를 쭉 연결)
    const step=n>1 ? (2*Math.PI-gap)/n : 0;
    const startA=-Math.PI/2 + gap/2 + step/2;
    const arcPer=step*ringMid;                            // 글자당 호 길이
    // 링 두께에 맞춰 글자 크기 자동 조정(어느 길이든 균일하게 채움)
    const afs=Math.max(26, Math.min(Math.round(band*0.74), Math.round(arcPer*0.74)));
    x.font=`bold ${afs}px "Noto Sans KR", sans-serif`;
    chars.forEach((ch,i)=>{ const a=startA+i*step; x.save(); x.translate(cx+ringMid*Math.cos(a), cy+ringMid*Math.sin(a)); x.rotate(a+Math.PI/2); x.fillText(ch,0,0); x.restore(); });
    const cfs=Math.floor(innerR*0.86);
    x.font=`bold ${cfs}px "Noto Serif KR", serif`;
    const off=innerR*0.44;
    [['代','表'],['理','事']].forEach((row,ri)=> row.forEach((chn,ci)=> x.fillText(chn, cx+(ci?off:-off), cy+(ri?off:-off))));
    return c.toDataURL('image/png');
  } else {
    // 근로자: 세로 타원 + 이름 세로 1열
    const n=chars.length;
    const w=224, h=Math.max(300, 96*n+70), cx=w/2, cy=h/2;
    const rx=96, ry=Math.round(h/2-14);
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const x=c.getContext('2d');
    x.strokeStyle=RED; x.fillStyle=RED; x.textAlign='center'; x.textBaseline='middle';
    x.lineWidth=9; x.beginPath(); x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); x.stroke();
    const fs=Math.max(60, Math.min(110, Math.floor((ry*1.7)/n)));
    x.font=`bold ${fs}px "Noto Sans KR", sans-serif`;
    const lh=Math.min(fs*1.08, (ry*1.75)/n);
    const y0=cy-(n-1)*lh/2;
    chars.forEach((ch,i)=> x.fillText(ch, cx, y0+i*lh));
    return c.toDataURL('image/png');
  }
}
function sealText(who){ return who==='biz' ? (S.bizName || S.bizRep || '') : (S.wName || ''); }
/* 이름 기반의 살짝 기울어진 각도(-7~+7도) — 손으로 찍은 느낌 */
function sealTilt(text){ let h=0; for(const ch of (text||'')) h=(h*31+ch.charCodeAt(0))>>>0; return (h%15)-7; }
function toggleSeal(who, on){ const key=who==='biz'?'sealBizOn':'sealWorkerOn'; S[key] = (on!==undefined ? on : S[key]!=='true') ? 'true' : ''; renderSeal(who); }

/* ---------- 서명 패드(그리기) — 사업주/근로자 공용, 선(좌표) 데이터로 저장 ---------- */
const SIGN_REF_W=460, SIGN_REF_H=200;
let _sigWho='worker', _sigStrokes=[], _sigCur=null, _sigDrawing=false, _sigCtx=null, _sigCv=null, _sigScaleX=1, _sigScaleY=1, _sigLastCss=null;
function sigKeyPath(who){ return who==='biz' ? 'bizSignPath' : 'wSignPath'; }
function _sigCss(e){ const r=_sigCv.getBoundingClientRect(); const t=(e.touches&&e.touches[0])||e; return {x:t.clientX-r.left, y:t.clientY-r.top}; }
function _sigPush(p){ const rx=Math.round(p.x*_sigScaleX), ry=Math.round(p.y*_sigScaleY); const cur=_sigCur; const n=cur.length; if(n>=2){ const dx=rx-cur[n-2], dy=ry-cur[n-1]; if(dx*dx+dy*dy<4) return; } cur.push(rx,ry); }
function openSignPad(who){
  _sigWho=who; _sigStrokes=[];
  const t=document.getElementById('signModalTitle'); if(t) t.textContent=(who==='biz'?'사업주':'근로자')+' 서명';
  document.getElementById('signModal').style.display='flex';
  const cv=document.getElementById('signCanvas'); _sigCv=cv;
  const r=cv.getBoundingClientRect();
  cv.width=Math.round(r.width*2); cv.height=Math.round(r.height*2);
  _sigCtx=cv.getContext('2d'); _sigCtx.scale(2,2);
  _sigCtx.lineWidth=2.5; _sigCtx.lineCap='round'; _sigCtx.lineJoin='round'; _sigCtx.strokeStyle='#12123a';
  _sigScaleX=SIGN_REF_W/r.width; _sigScaleY=SIGN_REF_H/r.height;
  cv.onpointerdown=e=>{ _sigDrawing=true; _sigCur=[]; _sigStrokes.push(_sigCur); _sigLastCss=_sigCss(e); _sigPush(_sigLastCss); e.preventDefault(); };
  cv.onpointermove=e=>{ if(!_sigDrawing) return; const p=_sigCss(e); _sigCtx.beginPath(); _sigCtx.moveTo(_sigLastCss.x,_sigLastCss.y); _sigCtx.lineTo(p.x,p.y); _sigCtx.stroke(); _sigLastCss=p; _sigPush(p); e.preventDefault(); };
  cv.onpointerup=cv.onpointerleave=()=>{ _sigDrawing=false; };
}
function clearSign(){ const cv=document.getElementById('signCanvas'); if(_sigCtx) _sigCtx.clearRect(0,0,cv.width,cv.height); _sigStrokes=[]; }
function closeSignPad(){ document.getElementById('signModal').style.display='none'; }
function saveSign(){
  if(!_sigStrokes.some(s=>s.length>=2)){ toast('서명을 먼저 그려주세요.'); return; }
  S[sigKeyPath(_sigWho)] = { w:SIGN_REF_W, h:SIGN_REF_H, s:_sigStrokes };
  renderSignPreviews();
  closeSignPad();
  toast('서명이 저장됐어요.');
}
/* 선 데이터 → 이미지(경계에 맞춰 잘라 렌더) */
function signPathToDataUrl(sig){
  if(!sig || !sig.s || !sig.s.length) return '';
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  sig.s.forEach(st=>{ for(let i=0;i<st.length;i+=2){ minX=Math.min(minX,st[i]); maxX=Math.max(maxX,st[i]); minY=Math.min(minY,st[i+1]); maxY=Math.max(maxY,st[i+1]); } });
  if(maxX<minX) return '';
  const pad=10, w=(maxX-minX)+pad*2, h=(maxY-minY)+pad*2, k=2;
  const cv=document.createElement('canvas'); cv.width=Math.max(2,Math.round(w*k)); cv.height=Math.max(2,Math.round(h*k));
  const x=cv.getContext('2d'); x.scale(k,k); x.translate(-minX+pad, -minY+pad);
  x.lineWidth=2.6; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#12123a';
  sig.s.forEach(st=>{ if(st.length<2) return; x.beginPath(); x.moveTo(st[0],st[1]); for(let i=2;i<st.length;i+=2) x.lineTo(st[i],st[i+1]); if(st.length===2) x.lineTo(st[0]+0.1,st[1]+0.1); x.stroke(); });
  return cv.toDataURL('image/png');
}
function renderSignPreviews(){
  [['biz','signPrev_biz'],['worker','signPrev_worker']].forEach(([who,id])=>{
    const el=document.getElementById(id); if(!el) return;
    const url=signPathToDataUrl(S[sigKeyPath(who)]);
    el.innerHTML = url ? `<img src="${url}">` : '<span class="seal-empty">서명 없음</span>';
  });
}
function renderSeal(who){
  const on = S[who==='biz'?'sealBizOn':'sealWorkerOn']==='true';
  const img = makeSeal(sealText(who), who);
  // 미리보기(항상 표시)
  const prev = document.getElementById(who==='biz'?'sealPrev_biz':'sealPrev_worker');
  if(prev){ prev.innerHTML = img ? `<img src="${img}" class="seal-thumb">` : `<span class="seal-empty">이름 입력 시</span>`; prev.classList.toggle('on', on); }
  // 체크박스 상태 반영
  const ck = document.getElementById(who==='biz'?'sealOn_biz':'sealOn_worker');
  if(ck) ck.checked = on;
  // 인쇄용 서명란: 체크됐고 이미지가 있을 때만
  const box = document.getElementById(who==='biz'?'seal_biz':'seal_worker');
  if(box) box.innerHTML = (on && img) ? `<img src="${img}" class="seal-img">` : '';
}

  });
  decorateLines(box);    // 항목 번호 + 삭제 버튼

  ['s_meal','s_car'].forEach(toggleAmt);  // 추가임금 금액칸 표시(상여금은 자유입력)
  if(!Array.isArray(S.payItems)) S.payItems=[];  // 기본 항목 없음('+ 항목 추가'로만 생성)

  checkPensionEligibility(); // 만 60세 이상 → 국민연금 해제
  renderSeal('biz'); renderSeal('worker'); // 서명란 도장
}

/* 날짜·시간 숫자칸(.step)에 박스 안 ▲▼ 증감 버튼을 붙인다 */
function stepVal(inp, d){
  const min = inp.dataset.min!=null ? +inp.dataset.min : 0;
  const max = inp.dataset.max!=null ? +inp.dataset.max : Infinity;
  let v;
  if(inp.value.trim() === ''){ v = numVal(inp.placeholder); }   // 빈 칸이면 기본값(placeholder)부터
  else { v = numVal(inp.value) + d; }
  if(v < min) v = min;
  if(v > max) v = max;
  inp.value = v;
  inp.dispatchEvent(new Event('input', {bubbles:true}));
}
function decorateSteppers(box){
  box.querySelectorAll('input.step').forEach(inp=>{
    if(inp.parentElement && inp.parentElement.classList.contains('stepper')) return;
    const wrap = document.createElement('span'); wrap.className = 'stepper';
    inp.parentNode.insertBefore(wrap, inp); wrap.appendChild(inp);
    const btns = document.createElement('span'); btns.className = 'stepbtns';
    const up = document.createElement('button'); up.type='button'; up.tabIndex=-1; up.textContent='▲';
    const dn = document.createElement('button'); dn.type='button'; dn.tabIndex=-1; dn.textContent='▼';
    up.addEventListener('click', ()=>stepVal(inp, 1));
    dn.addEventListener('click', ()=>stepVal(inp, -1));
    btns.appendChild(up); btns.appendChild(dn); wrap.appendChild(btns);
  });
}

/* 항목 번호 매김 — 삭제(removed)된 항목은 번호에서 제외 */
function bareLabel(t){
  return String(t||'').replace(/^\s*제\s*\d+\s*조\s*/, '').replace(/^\s*\d+\.\s*/, '')
    .replace(/^\s*\[/, '').replace(/\]\s*$/, '').replace(/[:：]\s*$/, '').trim();
}
function renumber(box){
  let n = 0;
  const jo = box.classList.contains('jo-num');
  box.querySelectorAll(':scope > .doc-line').forEach(dl=>{
    const ln = dl.querySelector('.ln');
    if(!ln || dl.classList.contains('removed') || dl.classList.contains('nonum')) return;
    n++;
    const numEl = ln.querySelector('.ln-num');
    if(numEl){ numEl.textContent = jo ? ('제'+n+'조 ') : (n + '. '); return; }   // 사용자 추가 항목
    if(ln.dataset.label == null) ln.dataset.label = bareLabel(ln.textContent);
    ln.textContent = jo ? ('제'+n+'조 ['+ln.dataset.label+']') : (n + '. ' + ln.dataset.label);
  });
}
/* 삭제 = 완전 제거가 아니라 그 자리에서 접고 '↩ 복구' 바를 노출 → 언제든 되돌릴 수 있음 */
function removeLine(dl){
  const ln = dl.querySelector('.ln');
  const labelEl = ln.querySelector('.ln-label');
  const label = labelEl ? (labelEl.textContent.trim() || '추가 항목')
    : ((ln.dataset.label != null) ? ln.dataset.label : ln.textContent.replace(/^\s*\d+\.\s*/, ''));
  if(!labelEl) ln.dataset.label = label;
  dl.classList.add('removed');
  if(!dl.querySelector('.restore-bar')){
    const bar = document.createElement('div');
    bar.className = 'restore-bar';
    bar.innerHTML = `<span>삭제된 항목 · <b>${label}</b></span><span class="restore-link" title="되돌리기" aria-label="되돌리기">↺</span>`;
    bar.querySelector('.restore-link').addEventListener('click', ()=>restoreLine(dl));
    dl.appendChild(bar);
  }
  renumber(dl.closest('.doc-preview'));
}
function restoreLine(dl){
  dl.classList.remove('removed');
  const bar = dl.querySelector('.restore-bar'); if(bar) bar.remove();
  renumber(dl.closest('.doc-preview'));
}
/* 추가 항목을 위/아래 조항과 자리 바꿔 위치 이동 */
function moveLine(dl, dir){
  const box = dl.parentNode; if(!box) return;
  const movable = el => el && el.classList.contains('doc-line') && !el.querySelector('.sig-grid');
  if(dir < 0){
    let prev = dl.previousElementSibling;
    while(prev && !movable(prev)) prev = prev.previousElementSibling;
    if(movable(prev)) box.insertBefore(dl, prev);
  } else {
    let next = dl.nextElementSibling;
    while(next && !movable(next)) next = next.nextElementSibling;
    if(movable(next)) box.insertBefore(next, dl);
  }
  renumber(box);
}

function decorateLines(box){
  box.querySelectorAll(':scope > .doc-line').forEach(dl=>{

/* ============================================================
   직렬화 · 출력 · 공유
   ============================================================ */
function serializeContract(){
  // 계약서 DOM을 인쇄/PDF/메일용 정적 텍스트로 변환
  const live = document.getElementById('contractDoc');
  const src = live.cloneNode(true);
  // cloneNode가 select 선택 등 현재 상태를 보존하지 않으므로 라이브 값을 클론에 반영
  const lc = live.querySelectorAll('input, select, textarea');
  const cc = src.querySelectorAll('input, select, textarea');
  lc.forEach((lv,i)=>{ const cl=cc[i]; if(!cl) return;
    if(lv.tagName==='SELECT') cl.selectedIndex = lv.selectedIndex;
    else if(lv.type==='checkbox' || lv.type==='radio') cl.checked = lv.checked;
    else cl.value = lv.value;
    cl.disabled = lv.disabled;
  });
  src.querySelectorAll('.doc-line.removed').forEach(n=>n.remove());   // 삭제된 항목은 인쇄·공유에서 제외
  src.querySelectorAll('[style]').forEach(el=>{ if(/display:\s*none/.test(el.getAttribute('style')||'')) el.remove(); });  // 숨김 옵션(종료일·연봉옵션 등) 제외
  ['s_meal','s_car'].forEach(key=>{   // 추가임금: 체크박스(☑/☐) 유지, 미체크 → '해당없음', 체크 → 금액
    const cb = src.querySelector(`[data-k="${key}Ck"]`);
    const checked = cb ? cb.checked : false;
    const amtInput = src.querySelector(`[data-k="${key}"]`);
    const wrap = amtInput ? amtInput.closest('.amt-wrap') : null;
    if(wrap && !checked) wrap.textContent = ' 해당없음';
    const modeSel = src.querySelector(`[data-k="${key}Mode"]`);
    if(modeSel && !checked) modeSel.remove();   // 미체크 항목은 포함/별도 표기 제외
  });
  src.querySelectorAll('.pay-item-row').forEach(r=>{ const nm=r.querySelector('.name'); const amt=r.querySelector('.amt'); if((!nm||!nm.value.trim()) && (!amt||!amt.value.trim())) r.remove(); });  // 내용 없는 추가항목은 인쇄 제외
  src.querySelectorAll('.wk-hd').forEach(n=>n.remove());
  src.querySelectorAll('.wk-row').forEach(r=>{
    const v = r.querySelectorAll('input');
    const nm=((v[0]&&v[0].value)||'').trim(), jn=((v[1]&&v[1].value)||'').trim();
    const pay=((v[2]&&v[2].value)||'').trim(), tax=((v[3]&&v[3].value)||'').trim();
    if(!nm && !jn && !pay){ r.remove(); return; }
    const d=document.createElement('div'); d.className='p-sub';
    d.textContent = [nm, jn, pay? '지급액 '+pay+'원':'', tax? '비과세 '+tax+'원':'']
      .filter(Boolean).join(' · ');
    r.replaceWith(d);
  });
  { const term = src.querySelector('select[data-k="s_term"]'); if(term){ const t=term.options[term.selectedIndex]?.text||''; const sp=document.createElement('span'); sp.textContent='('+t+')'; term.replaceWith(sp); } }  // 기간의 정함 → 괄호
  src.querySelectorAll('.reset-link, .stamped, .del-line, .restore-bar, .add-item-pill, .move-ctrl, .stepbtns, .pay-item-del, .wk-del, .wage-check, .net-est-wrap, .pay-hint, .pay-box-toggle, .seal-add').forEach(n=>n.remove());
  // 입력값을 텍스트로 치환
  src.querySelectorAll('input, select').forEach(inp=>{
    let v = '';
    if(inp.type==='checkbox'){ v = inp.checked ? '☑' : '☐'; }
    else if(inp.tagName==='SELECT'){ v = inp.options[inp.selectedIndex]?.text || ''; }
    else { v = inp.value || '____'; }
    const span = document.createElement('span');
    span.textContent = (inp.type==='checkbox') ? v : ' '+v+' ';
    span.style.fontWeight = '600';
    inp.replaceWith(span);
  });
  return src;
}

function titleParts(node){
  const nm = node.querySelector('.tb-name');
  if(nm){
    const tm = node.querySelector('.tb-term');
    return { name: nm.textContent.trim(), term: tm ? tm.textContent.trim() : '' };
  }
  return { name: (node.querySelector('h4')?.textContent || '고용계약서').trim(), term: '' };
}

function buildContractText(){
  const node = serializeContract();
  const tp = titleParts(node);
  const title = tp.name + (tp.term ? ' ' + tp.term : '');
  let lines = [title, ''];
  node.querySelectorAll(':scope > .doc-line').forEach(dl=>{
    const ln = dl.querySelector('.ln')?.textContent?.trim();
    const clone = dl.cloneNode(true);
    clone.querySelector('.ln')?.remove();
    const body = clone.textContent.replace(/\s+/g,' ').trim();
    if(ln) lines.push(`■ ${ln}`);
    if(body) lines.push(`   ${body}`);
  });
  return lines.join('\n');
}

      <div style="text-align:right; font-size:12pt; margin-bottom:16px;">동의일자 : ${fmtDate(new Date().toISOString().slice(0,10))}</div>
      <div style="text-align:right; font-size:12pt;">본인(정보주체) : ${esc(name)} ${signHtml}</div>
    </div>
  </div>`;
}

/* 제목+내용이 인쇄 한 줄에 들어가는지 판단(캔버스 실측) */
function fitsOneLine(label, content){
  try{
    const c=document.createElement('canvas'); const x=c.getContext('2d');
    x.font='bold 16px "Noto Sans KR", sans-serif';
    const w1=x.measureText((label||'')+' : ').width;
    x.font='16px "Noto Sans KR", sans-serif';
    const w2=x.measureText(content||'').width;
    return (w1+w2) <= 700;   // 인쇄 본문 한 줄 폭(보수적)
  }catch(e){ return (((label||'').length)+((content||'').length)) <= 32; }
}
function buildPrintHtml(withConsent){
  const node = serializeContract();
  const tp = titleParts(node);
  const intro = node.querySelector('.doc-intro')?.textContent || '';
  const titleHtml = tp.term
    ? `<div class="p-title-box"><span class="p-tb-name">${esc(tp.name)}</span> <span class="p-tb-term">${esc(tp.term)}</span></div>`
    : `<h1>${esc(tp.name)}</h1>`;
  let body = `${titleHtml}<div style="height:18px;"></div><p class="p-intro">${esc(intro)}</p>`;
  node.querySelectorAll(':scope > .doc-line').forEach(dl=>{
    // 서명란은 별도 처리
    if(dl.querySelector('.sig-grid')){
      const parties = dl.querySelectorAll('.sig-grid > div');
      let sig = '<div class="p-sig">';
      parties.forEach(p=>{
        sig += '<div>';
        const party = p.querySelector('.party')?.textContent||'';
        sig += `<div class="p-party">${esc(party)}</div>`;
        p.querySelectorAll('.sig-row').forEach(r=>{
          const sealBoxId = r.querySelector('.seal-box')?.id;
          const sealImg = r.querySelector('.seal-img');
          const isBiz = sealBoxId==='seal_biz';
          const isWorker = sealBoxId==='seal_worker';
          const c = r.cloneNode(true); c.querySelector('.seal-box')?.remove();
          const txt = c.textContent.replace(/\s+/g,' ').replace(/\(\s+/g,'(').replace(/\s+\)/g,')').trim();
          let rowHtml = esc(txt);
          // 직접 그린 서명이 있으면 (서명/인)을 서명 이미지로 대체(도장 겹칠 anchor 유지)
          let signedAnchor = false;
          const signUrl = isBiz ? signPathToDataUrl(S.bizSignPath) : (isWorker ? signPathToDataUrl(S.wSignPath) : '');
          if(signUrl){
            rowHtml = rowHtml.replace('(서명/인)', `<span class="sigimg-anchor" style="position:relative;display:inline-block;"><img src="${signUrl}" style="height:42px;width:auto;vertical-align:middle;"></span>`);
            signedAnchor = true;
          }
          if(sealImg){
            const src = sealImg.getAttribute('src');
            const sh = isBiz ? 66 : 59;   // 사업주(약 -20%)·근로자(약 -10%) 축소
            const tilt = sealTilt(isBiz ? (S.bizName||S.bizRep) : S.wName);
            const sealTag = `<img src="${src}" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-60%) rotate(${tilt}deg);height:${sh}px;width:auto;mix-blend-mode:multiply;pointer-events:none;">`;
            if(signedAnchor){
              rowHtml = rowHtml.replace('<span class="sigimg-anchor" style="position:relative;display:inline-block;">', `<span class="sigimg-anchor" style="position:relative;display:inline-block;">${sealTag}`);
            } else {
              rowHtml = rowHtml.replace('(서명/인)', `<span style="position:relative;">(서명/인)${sealTag}</span>`);
            }
          }
          sig += `<div class="p-srow">${rowHtml}</div>`;
        });
        sig += '</div>';
      });
      sig += '</div>';
      body += sig;
      return;
    }
    const ln = dl.querySelector('.ln')?.textContent?.trim();
    const inline = dl.classList.contains('row-inline');
    const lnColon = ln ? (ln + (/[:：]\s*$/.test(ln) ? '' : ' :')) : '';   // 제목 뒤 콜론
    const lnBlock  = ln ? `<span class="p-ln">${esc(ln)}</span>` : '';
    const lnInline = ln ? `<span class="p-lni">${esc(lnColon)}</span> ` : '';

    // 임금: ①②③④를 각각 한 줄로
    if(dl.querySelector('.subno')){
      body += `<div class="p-line">${lnBlock}</div>`;
      const emitSub = ch=>{
        if(ch.classList.contains('ln')) return;
        if(ch.classList.contains('pay-box')){
          if(ch.classList.contains('collapsed')) return;   // 세부내역을 접은 상태면 인쇄에서 제외
          // 화면과 동일하게 세부내역을 박스로 렌더링(3개씩)
          const title = (ch.querySelector('.pay-box-title')?.textContent||'').replace(/[▾▸]/g,'').trim();
          const cellHtml = cell=>{ const t=cell.textContent.replace(/\s+/g,' ').trim(); return t? `<div style="font-size:11.5pt;">${esc(t)}</div>`:''; };
          let inner=''; ch.querySelectorAll('.pay-flow .pay-cell, .custom-list .pay-item-row').forEach(c=>{ inner += cellHtml(c); });
          if(inner){
            body += `<div style="border:1px solid #ccc;border-radius:8px;padding:10px 14px;margin:6px 0 10px 16px;">`
                  + `<div style="font-weight:700;color:#4F53D6;font-size:11.5pt;margin-bottom:8px;">${esc(title)}</div>`
                  + `<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 14px;">${inner}</div>`
                  + `</div>`;
          }
          return;
        }
        if(ch.id==='s_customList' || ch.classList.contains('pay-extras') || ch.classList.contains('pay-grid2') || ch.classList.contains('pay-flow') || ch.classList.contains('pay-flow-custom')){
          [...ch.children].forEach(emitSub);
        } else if(ch.classList.contains('pay-box-body') || ch.classList.contains('pay-subdetail')){
          [...ch.children].forEach(emitSub);
        } else {
          const t = ch.textContent.replace(/\s+/g,' ').replace(/\(\s+/g,'(').replace(/\s+\)/g,')').trim();
          if(t) body += `<div class="p-sub">${esc(t)}</div>`;
        }
      };
      [...dl.children].forEach(emitSub);
      return;
    }
    // 사회보험: 체크된 항목만
    if(dl.querySelector('.inline-check') && /국민연금|고용보험/.test(dl.textContent)){
      const on = [...dl.querySelectorAll('.inline-check')].filter(l=>/☑/.test(l.textContent)).map(l=>'☑ '+l.textContent.replace(/[☑☐]/g,'').trim());
      body += `<div class="p-line">${lnInline}${esc(on.join('   ') || '해당 없음')}</div>`;
      return;
    }
    // 휴게시간: 문구는 다음 줄 괄호로
    const brk = dl.querySelector('.brk-note');
    if(brk){
      const note = brk.textContent.trim();
      const c = dl.cloneNode(true); c.querySelector('.ln')?.remove(); (c.querySelector('.brk-line') || c.querySelector('.brk-note'))?.remove();
      const main = c.textContent.replace(/\s+/g,' ').trim();
      body += `<div class="p-line">${lnInline}${esc(main)}</div>`;
      body += `<div class="p-body">(${esc(note)})</div>`;
      return;
    }
    // 체크 목록: 한 줄씩 내려쓴다
    const ckl = dl.querySelector('.ck-list');
    if(ckl){
      const lead = dl.querySelector('.doc-sub');
      let out = `<div class="p-line">${lnBlock}`;
      if(lead){ const t = lead.textContent.replace(/\s+/g,' ').trim(); if(t) out += `<div class="p-body">${esc(t)}</div>`; }
      ckl.querySelectorAll(':scope > label').forEach(lb=>{
        const mark = /☑/.test(lb.textContent) ? '☑' : '☐';
        const d = lb.querySelector('.d');
        let name;
        if(d){
          const c = lb.cloneNode(true); c.querySelector('.d')?.remove();
          name = c.textContent.replace(/[☑☐]/g,'').replace(/\s+/g,' ').trim()
               + ' — ' + d.textContent.replace(/\s+/g,' ').trim();
        } else {
          name = lb.textContent.replace(/[☑☐]/g,'').replace(/\s+/g,' ').trim();
        }
        out += `<div class="p-sub">${mark} ${esc(name)}</div>`;
      });
      // 체크 목록 뒤에 붙은 자유 입력칸
      dl.querySelectorAll(':scope > div > input, :scope > div > span').forEach(()=>{});
      const tail = [...dl.children].filter(c=>c!==ckl && !c.classList.contains('ln')
        && c!==lead && !c.classList.contains('del-line') && !c.classList.contains('move-ctrl'));
      tail.forEach(c=>{ const t=c.textContent.replace(/\s+/g,' ').trim(); if(t) out += `<div class="p-sub">${esc(t)}</div>`; });
      body += out + `</div>`;
      return;
    }
    // 표준계약서: 문단 목록(지급표 포함)
    const rows = dl.querySelector('.stdrows');
    if(rows){
      let out = `<div class="p-line">${lnBlock}`;
      const cb = dl.querySelector('.clause-body');
      if(cb) cb.textContent.split('\n').map(t=>t.replace(/\s+/g,' ').trim()).filter(Boolean)
        .forEach(t=> out += `<div class="p-body">${esc(t)}</div>`);
      const emit = el=>{ const t = el.textContent.replace(/\s+/g,' ').replace(/\(\s+/g,'(').replace(/\s+\)/g,')').trim();
        if(t) out += `<div class="p-body">${esc(t)}</div>`; };
      [...rows.children].forEach(ch=>{
        if(ch.classList.contains('paytbl')) [...ch.children].forEach(emit); else emit(ch);
      });
      body += out + `</div>`;
      return;
    }
    // 여러 문단으로 된 조항은 줄바꿈을 살린다
    const cbOnly = dl.querySelector('.clause-body');
    if(cbOnly && /\n/.test(cbOnly.textContent)){
      let out = `<div class="p-line">${lnBlock}`;
      cbOnly.textContent.split('\n').map(t=>t.replace(/\s+/g,' ').trim()).filter(Boolean)
        .forEach(t=> out += `<div class="p-body">${esc(t)}</div>`);
      body += out + `</div>`;
      return;
    }
    // 기본
    const clone = dl.cloneNode(true);
    clone.querySelector('.ln')?.remove();
    const txt = clone.textContent.replace(/\s+/g,' ').trim();
    // 한 줄에 들어가면 '제목 : 내용' 한 줄, 넘치면 제목만(콜론 없이) + 내용 줄바꿈
    if(inline || fitsOneLine(ln, txt)){
      body += `<div class="p-line">${lnInline}${esc(txt)}</div>`;
    } else {
      body += `<div class="p-line">${lnBlock}<div class="p-body">${esc(txt)}</div></div>`;
    }
  });
  body += buildClosingHtml();
  body += buildOfficeFooterHtml();
  if(withConsent) body += consentHtml();
  return body;
}

function closingText(){
  const v = S.offClosing || '';
  return v==='__custom__' ? (S.offClosingCustom||'') : v;
}
function buildClosingHtml(){
  const t = closingText();
  return t ? `<div class="p-closing-msg">${esc(t)}</div>` : '';
}
function buildOfficeFooterHtml(){
  const parts = [
    S.offBizNo && `사업자등록번호 ${esc(S.offBizNo)}`,
    S.offAddr && esc(S.offAddr),
    S.offPhone && `Tel. ${esc(S.offPhone)}`
  ].filter(Boolean);
  if(!S.offName && !parts.length) return '';
  return `<div class="p-office-footer">
    ${S.offName ? `<div><b>${esc(S.offName)}</b></div>` : ''}
    ${parts.length ? `<div>${parts.join(' · ')}</div>` : ''}
  </div>`;
}
function onClosingChange(sel){
  const custom = document.getElementById('offClosingCustom');
  const isCustom = sel.value==='__custom__';
  custom.style.display = isCustom ? 'block' : 'none';
  S.offClosing = sel.value;
}

async function printContract(){
  const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(isMobile){ await savePdf(); return; }   // 폰: 인쇄 대신 PDF 저장/공유(모바일 인쇄 불안정)
  document.getElementById('printArea').innerHTML = buildPrintHtml(!!DOCS[curDoc].consent);
  window.print();
}
async function savePdf(){
  toast('PDF를 만들고 있어요…');
  try{
    const blob = await buildPdfBlob();
    const fname = `${(S.wName||'고객')}_${docTitle()}.pdf`;
    const file = new File([blob], fname, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:docTitle()});   // 공유시트 → 저장/전송
    }else{
      downloadBlob(blob, fname);
      toast('PDF를 저장했어요.');
    }
  }catch(e){ if(e && e.name==='AbortError') return; toast('PDF 저장 중 문제가 발생했어요. 다시 시도해 주세요.'); }
}

/* 링크 복사 — 근로자가 폰에서 직접 작성할 수 있는 작성 링크(프로토타입: 데모 URL)를 클립보드에 복사 */
/* 입력값을 링크(URL)에 담아 공유 — 백엔드 없이 링크만으로 계약서 전달 */
function encodeState(){
  const payload = { S, doc: curDoc, type: curType, sub: curSub };   // 서명(선 데이터)도 함께 담아 양쪽에서 확인
  return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
}
function applyStateFromUrl(){
  const m = (location.hash||'').match(/[#&]d=([^&]+)/);
  if(!m) return false;
  try{
    const payload = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    Object.keys(S).forEach(k=>delete S[k]);
    Object.assign(S, payload.S||{});
    if(payload.doc && DOCS[payload.doc]) curDoc = payload.doc;
    if(payload.type) curType = payload.type;
    if(payload.sub)  curSub  = payload.sub;
    if(Array.isArray(S.wkItems)) wkItems = S.wkItems;
    return true;
  }catch(e){ return false; }
}
function makeShareUrl(){
  const base = location.href.split('#')[0].split('?')[0];
  return base + '?doc=' + curDoc + '#d=' + encodeState();
}
/* 빈 서식 링크 — 값 없이 서식만 열어 주는 주소 */
function makeBlankUrl(k){
  return location.href.split('#')[0].split('?')[0] + '?doc=' + (k||curDoc);
}
async function copyLink(){
  const url = makeShareUrl();
  try{
    await navigator.clipboard.writeText(url);
    toast('작성 링크를 복사했어요. 고객에게 붙여넣어 보내세요.');
  }catch(e){
    window.prompt('아래 작성 링크를 복사하세요 (전체 선택 후 복사)', url);
  }
}

async function buildPdfBlob(){
  const { jsPDF } = window.jspdf;
  // 인쇄용 정적 HTML을 오프스크린에 렌더 후 캡처
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed; left:-99999px; top:0; width:794px; background:#fff; padding:40px; font-family:\'Noto Sans KR\',sans-serif; color:#111; font-size:12pt; line-height:1.7;';
  holder.innerHTML = buildPrintHtml(!!DOCS[curDoc].consent)
     .replace(/class="p-tb-name"/g,'style="display:inline;font-size:16pt;font-weight:800;"')
     .replace(/class="p-tb-term"/g,'style="display:inline;font-size:12pt;font-weight:600;color:#555;margin-left:6px;"')
     .replace(/class="p-title-box"/g,'style="display:table;border:1.5px solid #111;border-radius:8px;padding:6px 18px;margin:0 auto 10px;"')
     .replace(/class="p-ln"/g,'style="color:#4F53D6;font-weight:700;display:block;font-size:12pt;"')
     .replace(/class="p-lni"/g,'style="color:#4F53D6;font-weight:700;display:inline;margin-right:6px;font-size:12pt;"')
     .replace(/class="p-intro"/g,'style="text-align:left;color:#333;font-size:12pt;margin:14px 0 20px;"')
     .replace(/class="p-sub"/g,'style="margin:0 0 6px 16px;font-size:12pt;"')
     .replace(/class="p-body"/g,'style="padding-left:16px;margin-bottom:10px;font-size:12pt;"')
     .replace(/class="p-line"/g,'style="margin-bottom:10px;font-size:12pt;"')
     .replace(/class="p-sig"/g,'style="display:grid;grid-template-columns:1fr;gap:22px;margin-top:24px;border-top:1px solid #ccc;padding-top:16px;"')
     .replace(/class="p-party"/g,'style="color:#4F53D6;font-weight:700;font-size:12pt;margin-bottom:6px;"')
     .replace(/class="p-srow"/g,'style="font-size:12pt;margin-bottom:6px;"')
     .replace(/class="p-closing-msg"/g,'style="margin-top:40px;text-align:center;font-size:12pt;color:#333;line-height:1.7;"')
     .replace(/class="p-office-footer"/g,'style="margin-top:56px;padding-top:14px;border-top:1px solid #ccc;font-size:12pt;color:#444;text-align:center;line-height:1.6;"')
     .replace(/class="p-foot"/g,'style="margin-top:14px;font-size:9pt;color:#aaa;text-align:center;"')
     .replace(/class="p-consent"/g,'style="margin-top:40px;border-top:2px dashed #ccc;padding-top:24px;"')
     .replace(/<h1>/g,'<h1 style="text-align:center;font-size:16pt;font-weight:800;margin-bottom:6px;">');
  document.body.appendChild(holder);
  const canvas = await html2canvas(holder, {scale:2, backgroundColor:'#ffffff'});
  document.body.removeChild(holder);

  const pdf = new jsPDF('p','mm','a4');
  const pw = 210, ph = 297;
  const imgH = canvas.height * pw / canvas.width;
  let left = imgH, pos = 0;
  const img = canvas.toDataURL('image/jpeg', 0.95);
  pdf.addImage(img, 'JPEG', 0, pos, pw, imgH);
  left -= ph;
  while(left > 0){ pos = left - imgH; pdf.addPage(); pdf.addImage(img,'JPEG',0,pos,pw,imgH); left -= ph; }
  return pdf.output('blob');
}

async function shareKakao(){
  toast('계약서 PDF를 준비하고 있어요…');
  try{
    const blob = await buildPdfBlob();
    const fname = `${(S.wName||'고객')}_${docTitle()}.pdf`;
    const file = new File([blob], fname, {type:'application/pdf'});
    // 모바일: 시스템 공유시트(카카오톡 선택) → 데스크톱: 파일 저장 후 안내
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:docTitle(), text:`${OFFICE.상호}에서 보내드리는 서식입니다.`});
      logKakao();
    }else{
      downloadBlob(blob, fname);
      window.open('http://pf.kakao.com/_TZegG/chat','_blank');
      toast('PDF를 저장했어요. 카카오톡 대화창에 첨부해 보내주세요.');
      logKakao();
    }
  }catch(err){
    if(err && err.name==='AbortError') return; // 사용자가 공유 취소
    toast('공유 준비 중 문제가 발생했어요. 출력(인쇄)으로 저장해 주세요.');
  }
}
function logKakao(){ toast('카카오톡 공유가 시작됐어요.'); }

async function shareEmail(){
  toast('PDF를 준비하고 있어요…');
  try{
    const blob = await buildPdfBlob();
    const fname = `${(S.wName||'고객')}_${docTitle()}.pdf`;
    const file = new File([blob], fname, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      // 모바일: 공유시트에서 메일 선택 → PDF가 첨부됨(본문에 계약 내용 없음)
      await navigator.share({files:[file], title:docTitle(), text:`${docTitle()}를 보내드립니다.`});
    }else{
      // 데스크톱: PDF 저장 후 메일 앱 열기(본문엔 계약 내용 없이 첨부 안내만)
      downloadBlob(blob, fname);
      const subject = encodeURIComponent(`[${OFFICE.상호}] ${docTitle()}`);
      const body = encodeURIComponent(`안녕하세요.\n${docTitle()}를 보내드립니다.\n방금 저장된 PDF 파일(${fname})을 이 메일에 첨부해 주세요.\n\n— ${OFFICE.상호}`);
      location.href = `mailto:?subject=${subject}&body=${body}`;
      toast('PDF를 저장했어요. 메일에 첨부해 보내주세요.');
    }
  }catch(err){ if(err && err.name==='AbortError') return; toast('메일 준비 중 문제가 발생했어요. 다시 시도해 주세요.'); }
}

function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function docTitle(){
  const h = document.querySelector('#contractDoc h4 .tb-name');
  return (h? h.textContent : '') || DOCS[curDoc].t;
}

function issueContract(){
  if(credit<=0){ toast('무료체험 3건을 모두 사용했어요.'); return; }
  credit--; document.getElementById('creditDisplay').textContent = credit;
  document.getElementById('docStamp').classList.add('show');
  toast(`${docTitle()} + 개인정보동의서 발급 완료 (남은 무료 ${credit}건)`);

let wkItems = [];
function addWorker(){ wkItems.push({n:'',j:'',p:'',t:''}); renderWorkers(); }
function delWorker(i){ wkItems.splice(i,1); renderWorkers(); }
function setWorker(i,k,el){
  if(k==='p'||k==='t') formatAmtEl(el);
  if(wkItems[i]) wkItems[i][k] = el.value;
}
function renderWorkers(){
  const box = document.getElementById('wkList'); if(!box) return;
  S.wkItems = wkItems;
  box.innerHTML = wkItems.map((w,i)=>`<div class="wk-row">
    <input class="blank" value="${esc(w.n)}" placeholder="성명" oninput="setWorker(${i},'n',this)">
    <input class="blank" value="${esc(w.j)}" placeholder="000000-0000000" oninput="setWorker(${i},'j',this)">
    <input class="blank num amt" value="${esc(w.p)}" placeholder="지급액" inputmode="numeric" oninput="setWorker(${i},'p',this)">
    <input class="blank num amt" value="${esc(w.t)}" placeholder="비과세" inputmode="numeric" oninput="setWorker(${i},'t',this)">
    <span class="wk-del" onclick="delWorker(${i})">✕</span></div>`).join('')
    || '<div class="doc-sub" style="margin:4px 0 0">아래 버튼으로 근로자를 추가해 주세요.</div>';
}

/* ---------- 공통 조각 ---------- */
const SB = (k, ph, w, cls) =>
  `<input class="blank ${cls||''}" data-k="${k}" placeholder="${ph||''}"${w?` style="width:${w};min-width:0"`:''}>`;

/* 입력칸이 들어가는 조항 — 문단을 한 줄씩 */
const stdWrap = paras => paras.map(p=>
  /^\s*<div class="paytbl"/.test(p) ? p : `<div class="stdrow">${p}</div>`).join('');
function stdClause(label, paras){
  return `<div class="doc-line"><span class="ln">${label}</span>
    <div class="stdrows">${stdWrap(paras)}</div></div>`;
}
/* 번호를 매기지 않는 줄(머리 정보 · 확인 문구 · 붙임서류) */
function stdPlain(label, paras){
  return `<div class="doc-line nonum">${label?`<span class="ln">${label}</span>`:''}
    <div class="stdrows">${stdWrap(paras)}</div></div>`;
}
/* 번호 없는 날짜 줄 */
function stdDate(label, k){
  return `<div class="doc-line nonum row-inline"><span class="ln">${label}:</span>
    <div><input class="blank dateauto" style="width:118px;min-width:0;" data-k="${k}" placeholder="2026-08-20"></div></div>`;
}
/* 지급표 */
function stdPayTable(pfx, rows, withNote){
  const c = withNote? 'ptr' : 'ptr pt3';
  const head = `<div class="stdrow ${c}"><span>구분</span><span>지급기한</span><span>금액</span>${withNote?'<span>비고</span>':''}</div>`;
  const body = rows.map((nm,i)=>`<div class="stdrow ${c}"><span>${nm}</span>
    <span>${SB(pfx+'_d'+i,'20  년   월   일')}</span>
    <span>${SB(pfx+'_a'+i,'','100%','num amt')} 원</span>
    ${withNote?`<span>${SB(pfx+'_n'+i,'')}</span>`:''}</div>`).join('');
  return `<div class="paytbl">${head}${body}</div>`;
}
/* 특약조항 */
function stdSpecial(pfx){
  const id = pfx+'_sp';
  CLAUSE_DEFAULTS[id] = SC.special;
  return `<div class="doc-line"><span class="ln">특약조항</span>
    <div class="clause-wrap">
      <div class="clause-body" id="cl_${id}" contenteditable="true" oninput="markEdited('${id}')">${esc(SC.special)}</div>
      <span class="reset-link" onclick="resetClause('${id}')" title="기본문구로 되돌리기" style="display:none;">↺</span>
    </div>
    <div class="stdrows">${[1,2,3].map(i=>
      `<div class="stdrow">${i}. ${SB(pfx+'_sp'+i,'','78%')}</div>`).join('')}</div></div>`;
}

/* ---------- 3·5. 양도소득세 · 증여세 (같은 뼈대) ---------- */
function tplTransfer(kind){
  const gift = (kind==='gift');
  const p = gift? 'tg':'tc';
  const 물건 = gift? '증여 물건':'양도 물건';
  const scope = gift
    ? '갑은 을을 대리인으로 증여세 신고에 관한 업무(세무사법 제2조 제1호)를 위임한다. 구체적인 업무 범위는 별첨(업무기준표)에 따른다. 다만, 위임업무의 범위에 증여세 신고 후 이에 관한 조사 대응 업무는 포함하지 아니한다.'
    : '갑은 을을 대리인으로 양도소득세 신고에 관한 업무(세무사법 제2조 제1호)를 위임한다. 구체적인 업무 범위는 별첨(업무기준표)에 따른다.';
  const term = gift
    ? `① 본 계약의 유효기간은 증여일로부터 3월이 되는 날이 속하는 달의 말일까지로 하고, 중도에 계약을 해지하고자 하는 때에는 계약해지일로부터 ${SB(p+'_d1','','56px','num')} 일 이전까지 서면으로 통지하여야 한다.`
    : `① 본 계약의 유효기간은 매매계약일로부터 2월이 되는 날이 속하는 달의 말일까지로 하고, 중도에 계약을 해지하고자 하는 때에는 계약해지일로부터 ${SB(p+'_d1','','56px','num')} 일 이전까지 서면으로 통지하여야 한다.`;

  const feeParas = [
    `① 본 계약에 따른 보수는 일금 ${SB(p+'_feeh','','130px')} 원정(￦ ${SB(p+'_fee','','120px','num amt')} , 부가가치세 별도)으로 하고,
      착수금 일금 ${SB(p+'_downh','','120px')} 원(￦ ${SB(p+'_down','','110px','num amt')} )은 반환하지 아니한다.
      위 보수지급은 과세표준 및 납부세액 신고서 접수 전에 지급을 완료하기로 한다.`,
    '② 제1항의 보수를 다음과 같이 갑이 을에게 지급하기로 한다.',
    stdPayTable(p, ['착수금','중도금','잔　금'], true),
    '③ 본 계약에 따른 업무수행에 필요로 하는 서류징취비, 인지대, 출장비 및 기타경비 등의 실비는 갑이 부담하기로 한다.',
  ];
  if(gift) feeParas.push('④ 본 건 증여세 신고 후 과세관청의 「증여세 조사와 관련한 보수」(소명 요구 사항에 대한 자료 검토 및 자료작성, 답변서 제출 등 조사와 관련한 일체의 업무) 및 지급 방법은 증여세 조사착수 때 「별도계약」에 의한다.');

  return stdTitle('세무대리 계약서', gift? '(증여세)':'(양도소득세)') + stdIntroTax() +
  stdClause('업무 범위', [ scope, `${물건}: ${SB(p+'_item','', '62%')}` ]) +
  stdClause('보수', feeParas) +
  labeledClause(p+'_payway','보수의 지급 방법', SC.payWay(2)) +
  labeledClause(p+'_late','보수지급의 지체', SC.late) +
  labeledClause(p+'_duty','의무', SC.duty) +
  labeledClause(p+'_free','책임 및 면책', SC.free) +
  labeledClause(p+'_limit','책임의 제한', SC.limit) +
  stdClause('계약해지', [term,
    '② 갑의 사정으로 본 계약을 해지하는 때는 계약해지 이후에 야기되는 세무 처리에 대하여 을은 그 책임을 지지 아니한다.',
    gift? '③ 갑이 본 계약에 정한 의무를 이행하지 아니하거나 위임사무의 내용에 관하여 제공한 자료가 불비 및 허위일 때에는 고의가 아닌 경우라도 을은 본 계약을 해지할 수 있다.'
        : '③ 갑이 본 계약에 정한 의무를 이행하지 아니하거나 위임사무의 내용에 관하여 제공한 자료가 불비 및 허위일 때에는 고의가 아닌 경우라도 을은 본 계약을 해지하고 사임할 수 있다.',
    '④ 을의 사정으로 본 계약에 따른 업무를 수행할 수 없는 때에는 을은 그 시점까지 모든 업무를 정리하고, 갑과 을의 협의로 본 계약업무를 종결시키기로 한다.',
  ]) +
  labeledClause(p+'_secret','기밀보장', SC.secret) +
  labeledClause(p+'_dispute','분쟁의 해결', SC.dispute) +
  stdSpecial(p) +
  `<div id="addClauseRow" class="add-clause-row"><button type="button" class="add-item-pill" onclick="addCustomClause()">+ 조항 추가</button></div>` +
  stdEnd(p) +
  (gift? stdPlain('붙임서류', ['증여계약서']) : '');
}

    goal:'본 용역은 「건설산업기본법」 제10조(건설업의 등록기준) 및 제23조(시공능력의 평가 및 공시)에 따라서 자본금의 충족 여부 및 재무제표의 적정성과 각종 재무비율에 적합하도록 을은 갑에게 재무제표 작성지원 업무를 제공하는 것을 목적으로 한다.',

  svcCons: {p:'sc', term:'(건설업 컨설팅)', subject:'「건설업 컨설팅」',
    goal:'본 용역은 「건설산업기본법」 제10조(건설업의 등록기준) 및 제23조(시공능력의 평가 및 공시)에 따라서 자본금의 충족 여부 및 재무제표의 적정성과 각종 재무비율에 적합하도록 을은 갑에게 재무제표 작성지원 업무를 제공하는 것을 목적으로 한다.',

function tplSvc(key){
  const d = SVC_DEF[key], p = d.p;
  let out = stdTitle('용역계약서', d.term) +
  `<p class="doc-intro"><b data-mirror="wName">의뢰인</b>(이하 "갑")와 세무사 <b>${OFFICE.대표자}</b>(${OFFICE.상호}, 이하 "을")는
    ${d.subject}에 관한 용역에 관한 계약(이하 "본 계약")을 다음과 같이 체결한다.</p>` +
  labeledClause(p+'_goal', d.dd? '목적':'용역의 목적', d.goal) +
  labeledClause(p+'_scope','용역의 범위', d.scope);

  if(d.dd){
    out += stdClause('용역 기간', [
      `① 본 계약의 존속기간은 계약체결일로부터 ${SB(p+'_end','20  년   월   일','160px')} 까지로 하되,
        계약의 종기 전 본건이 완료되는 경우 그 완료일까지로 한다.`,
      `② 다만, ${SB(p+'_end2','20  년   월   일','160px')} 까지 본건이 완료되지 아니할 경우에는 갑·을은 상호 협의하여
        본 계약기간을 연장하되, 이 경우 을에 대한 추가보수는 상호 협의하여 결정하기로 한다.`,
    ]);
  } else {
    out += stdClause('용역대상 사업연도', [
      `매년 1월 1일부터 12월 31일을 1개의 사업연도로 하며, 용역대상 사업연도는
        ${SB(p+'_fy1','20  ','70px')} 년 1월 1일부터 ${SB(p+'_fy2','20  ','70px')} 년 12월 31일까지로 한다.`,
    ]) +
    stdClause('용역제공 완료 및 산출물의 보고', [
      `용역제공 완료일은 ${SB(p+'_done','20  년   월   일','160px')} 까지로 하고,
        산출물의 최종보고는 ${SB(p+'_rep','20  년   월   일','160px')} 까지로 한다.
        다만, 용역제공 완료 전에 중간보고를 할 수 있다.`,
    ]);
  }

  const feeNo = d.dd? 4 : 5;
  out += stdClause('용역 보수', [
    `① 본 계약에 따른 용역 보수는 일금 ${SB(p+'_feeh','','130px')} 원(₩ ${SB(p+'_fee','','120px','num amt')} , 부가가치세 별도)으로 한다.`,
    '② 갑은 본 계약과 관련하여 용역 보수를 다음과 같이 지급한다.',
    stdPayTable(p, ['착수금','잔　금'], false),
    '③ 상기 보수 이외에 인쇄비 및 출장비 등 실경비는 갑의 부담으로 한다.',
  ]) +
  labeledClause(p+'_payway','보수의 지급 방법', SC.payWay(feeNo)) +
  labeledClause(p+'_late','보수지급의 지체', SC.late) +
  labeledClause(p+'_duty','의무', SC.duty) +
  labeledClause(p+'_free','책임 및 면책', SC.free) +
  labeledClause(p+'_limit','책임의 제한', SC.limit) +
  labeledClause(p+'_quit','계약해지',
    '갑의 사정에 의하여 본 계약을 해약할 때에는 갑은 기지급한 보수액의 반환을 청구하지 못한다. 다만, 을의 사정으로 본 계약을 해약할 때는 을은 기수령한 보수액을 반환하며, 갑과 을의 사정으로 인한 불가항력적 사유로 인하여 계약의 이행이 불가능하게 된 때에는 계약은 종료하는 것으로 하고, 보수의 지급 등에 관하여는 상호 합의에 따라 정하는 것으로 한다.') +
  labeledClause(p+'_secret','기밀보장', SC.secret) +
  labeledClause(p+'_dispute','분쟁의 해결', SC.dispute) +
  stdSpecial(p) +
  `<div id="addClauseRow" class="add-clause-row"><button type="button" class="add-item-pill" onclick="addCustomClause()">+ 조항 추가</button></div>` +
  stdEnd(p, {corp:true});
  return out;
}
function tplSvcDiag(){ return tplSvc('svcDiag'); }
function tplSvcCons(){ return tplSvc('svcCons'); }
function tplSvcDd(){   return tplSvc('svcDd'); }

function backToOffice(){
  // 사무실 프로그램이 열어 준 탭이면 닫고, 아니면 이전 화면으로
  try{ window.close(); }catch(e){}
  setTimeout(()=>{ if(history.length>1) history.back(); }, 120);
}

/* ---------- 초기 렌더 ---------- */
(function boot(){
  // 주소에 ?doc=... 가 있으면 그 서식으로 연다
  const q = (location.search||'').match(/[?&]doc=([a-zA-Z0-9_]+)/);
  let missDoc = '';
  if(q){ if(DOCS[q[1]]) curDoc = q[1]; else missDoc = q[1]; }
  const had = applyStateFromUrl();
  if(!had){
    const t = new Date();
    const isoD = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const lastM = new Date(t.getFullYear(), t.getMonth()-1, 1);
    S.doc_date = isoD(t); S.pr_pay = isoD(t); S.nt_date = isoD(t);
    S.pr_month = S.rq_month = lastM.getFullYear()+'-'+String(lastM.getMonth()+1).padStart(2,'0');
  }
  // 세무대리인 칸은 언제나 사무실 정보로 썬다
  S.ofName = OFFICE.상호; S.ofRep = OFFICE.대표자;
  S.ofNo = OFFICE.사업자등록번호; S.ofPhone = OFFICE.전화;

  if(/[?&]from=office\b/.test(location.search)) document.body.classList.add('from-office');
  renderDocPicker();
  renderPanels();
  document.querySelectorAll('#typeTabs .type-tab').forEach(b=>b.classList.toggle('active', b.dataset.type===curType));
  document.querySelectorAll('#stdSubType button').forEach(b=>b.classList.toggle('on', b.dataset.v===curSub));
  renderContract();
  applyState(document.body);    // 정보 패널 입력칸도 링크 값으로 채우기
  refreshMirrors();
  renderSignPreviews();         // 링크에 담긴 서명 표시
  if(missDoc){                  // 옆 서식 파일이면 조용히 고용계약서로 넘어가지 않고 알려 준다
    const head = document.querySelector('.tool-head');
    const w = document.createElement('div');
    w.className = 'stale-warn';
    w.innerHTML = `요청하신 서식(<b>${missDoc}</b>)이 이 파일에 없습니다.<br>`
      + `사무실 프로그램과 <b>같은 폴더</b>의 <b>forms.html</b>을 최신 파일로 바꿔 주세요. `
      + `(지금 열린 서식 파일: <b>${FORMS_VER}</b> · 서식 ${Object.keys(DOCS).length}종)`;
    head.parentNode.insertBefore(w, head);
  }
})();
</script>
